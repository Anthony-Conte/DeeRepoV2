<main class="player" [class.guide-preview]="guideMode">
  @if (state$ | async; as state) {
    @if (state.status === 'ready') {
        <video
          autoplay
          playsinline
          preload="metadata"
          [src]="state.episode.url"
          (loadedmetadata)="seekToStart(player, state.startAt, state.offsetObservedAt)"
          (ended)="playNextChannelEpisode(state.channelId, state.episode.id)"
          #player
        >
          Your browser does not support HTML video.
        </video>
    }
  }
</main>
